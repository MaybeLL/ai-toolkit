name: CI

on:
  push:
    branches: [main, release-v1]
  pull_request:
    branches: [main, release-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    name: Skills (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: skills-${{ github.sha }}
          path: dist/
          if-no-files-found: error
