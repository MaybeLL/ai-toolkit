name: CI

on:
  push:
    branches:
      - main
      - release-v1
  pull_request:
    branches:
      - main
      - release-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-metadata:
    name: Plugin metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate manifests, marketplace entries, and Skills
        run: node scripts/validate-plugin-metadata.mjs
