task: payment-system
version: 1
origin: generated
labels: [idempotency]
difficulty: 0.6
prompt: |
  设计一个支付系统的核心下单扣款接口:用户在 App 点"确认支付",
  后端扣款并创建支付单。要求考虑网络重试与用户重复操作;
  追问环节会引入一个陌生业务方场景(批量代发)检验设计的迁移性。
grader:
  checks:
    - id: c1
      text: 无提示主动识别重复扣款风险(超时重试/连点)
      must_pass: true
    - id: c2
      text: 幂等键机制完整:键+结果存储、重复请求回放结果、重试必须复用同键
    - id: c3
      text: 在陌生业务(批量代发/部分修正重传)中正确迁移幂等设计,给出键粒度方案
reference_solution: |
  主动点出重复扣款 → 客户端生成幂等键、服务端键+结果原子存储、重试同键回放 →
  批量代发:键粒度下沉到"每笔打款意图"(员工+周期+金额版本),文件重传时
  已成功的单笔命中幂等直接回放、修正的单笔是新意图新键,不重付也不漏付。
